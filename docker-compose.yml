version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fireline_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fireline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fireline_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-fireline_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fireline_user} -d ${POSTGRES_DB:-fireline_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fireline_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fireline_user}:${POSTGRES_PASSWORD:-fireline_secret_2026}@postgres:5432/${POSTGRES_DB:-fireline_db}?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-fireline_jwt_secret_key_wia_mia_2026}
      DATA_SERVICE_URL: ${DATA_SERVICE_URL:-http://host.docker.internal:8000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
